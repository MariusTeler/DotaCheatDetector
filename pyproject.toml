[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dotacheat"
version = "0.1.0"
description = "Post-match Dota 2 replay analyzer that computes an explainable cheat-suspicion score (not a verdict)."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["gem-dota==0.14.0", "zstandard>=0.25"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
dotacheat = "dotacheat.cli:main"

[tool.setuptools]
packages = ["dotacheat", "dotacheat.heuristics", "dotacheat.report"]

[tool.setuptools.package-data]
dotacheat = ["default_config.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
