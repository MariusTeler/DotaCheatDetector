name: windows-build

on:
  push:
    branches: ["**"]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install .[dev] pyinstaller
      - name: Unit tests
        run: python -m pytest -q
      - name: Build exe
        run: pyinstaller --noconfirm --distpath dist --workpath build packaging/dotacheat.spec
      - name: Smoke test
        run: dist\dotacheat\dotacheat.exe --version
      - uses: actions/upload-artifact@v4
        with:
          name: dotacheat-windows
          path: dist/dotacheat
